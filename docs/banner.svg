    <rect x="501" y="264" width="180" height="40" rx="10" fill="#a5b4fc" fill-opacity=".12" stroke="#a5b4fc" stroke-opacity=".4"/>
    <text x="591" y="290" fill="#c7d2fe">HTML / JSX</text>
