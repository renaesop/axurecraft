<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">AxureCraft</title>
  <desc id="desc">From prototype to editable code. RP9 to semantic UI to HTML and JSX.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#10162e"/><stop offset="1" stop-color="#232048"/></linearGradient>
    <linearGradient id="accent" x2="1" y2="1"><stop stop-color="#a5b4fc"/><stop offset="1" stop-color="#67e8f9"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#a5b4fc" stroke-opacity=".06"/></pattern>
  </defs>
  <rect width="1200" height="360" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="24" fill="url(#grid)"/>
  <g transform="translate(64 58)">
