    <path d="M15 45L32 16L49 45M23 33H41" stroke="#17203d" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="152" y="106" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="49" font-weight="700" letter-spacing="-1">AxureCraft</text>
  <text x="64" y="179" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="28">From prototype to editable code.</text>
  <text x="64" y="219" fill="#a5b4cf" font-family="system-ui, sans-serif" font-size="18">A TypeScript parser and semantic UI compiler for Axure RP9.</text>
