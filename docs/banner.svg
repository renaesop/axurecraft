    <circle cx="22" cy="22" r="4" fill="#a5b4fc"/><circle cx="38" cy="22" r="4" fill="#a5b4fc" opacity=".6"/><circle cx="54" cy="22" r="4" fill="#a5b4fc" opacity=".3"/>
    <path d="M65 82L36 111L65 140M145 82L174 111L145 140M118 73L94 149" fill="none" stroke="url(#accent)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="36" y="173" width="138" height="5" rx="2.5" fill="#818cf8" opacity=".3"/>
